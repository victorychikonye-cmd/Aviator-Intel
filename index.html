<script>
const PL=['Winnbucks','Mwos','PrideBet'],NAV=[['Dashboard','dash'],['Winnbucks Analysis','Winnbucks'],['Mwos Analysis','Mwos'],['PrideBet Analysis','PrideBet'],['Compare Platforms','cmp'],['Historical Replay','rep'],['AI Analyst','ai'],['Anomaly Detection','an'],['Backtesting Lab','bt'],['Data Management','dm'],['Research Reports','rr'],['Settings','set']];
let D={rounds:[],imp:[],audit:[],name:'',seq:1},S={v:'dash',p:'All',cp:0,from:'',to:'',chat:[],ri:0,rpp:'Winnbucks',rps:'',sp:5,tr:70,rp:'All',rh:'',msg:''};

const save=()=>{if(!U)try{localStorage.setItem('aipm',JSON.stringify(D))}catch(e){}},$=s=>document.querySelector(s);
const sum=a=>a.reduce((x,y)=>x+y,0),f2=x=>x==null||isNaN(x)?'–':(+x).toFixed(2),pc=x=>(x*100).toFixed(1)+'%',dt=t=>t?new Date(t).toLocaleString():'no timestamp',esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const log=m=>{D.audit.unshift({t:Date.now(),m});D.audit=D.audit.slice(0,200);if(U)sb.from('audit_log').insert({message:String(m).slice(0,500)}).then(()=>{})};
const get=(p,fr,to)=>D.rounds.filter(x=>(p=='All'||x.p==p)&&(!fr||(x.t&&x.t>=fr))&&(!to||(x.t&&x.t<=to))).sort((a,b)=>(a.t||0)-(b.t||0)||a.id-b.id);
/* ---- statistics ---- */
function st(a){const n=a.length;if(!n)return{n:0};const s=[...a].sort((x,y)=>x-y),mean=sum(a)/n,v=n>1?sum(a.map(x=>(x-mean)**2))/(n-1):0,q=p=>s[Math.min(n-1,Math.floor(p*(n-1)+.5))];return{n,mean,v,sd:Math.sqrt(v),med:q(.5),min:s[0],max:s[n-1],p:[.1,.25,.75,.9,.99].map(q),ci:1.96*Math.sqrt(v/n)}}
const E=[1,1.5,2,3,5,10,50,1e9],BL=['1–1.49','1.5–1.99','2–2.99','3–4.99','5–9.99','10–49.99','50+'],CR=[0,3.84,5.99,7.81,9.49,11.07,12.59];
const S1=x=>x<=1?1:x>=1e9?0:.97/x,tp=E.slice(0,7).map((e,i)=>S1(e)-S1(E[i+1]));
const bc=a=>{const c=Array(7).fill(0);a.forEach(x=>{for(let i=0;i<7;i++)if(x<E[i+1]){c[i]++;break}});return c};
const chi=(c,pr=tp)=>{const n=sum(c);return sum(c.map((o,i)=>(o-n*pr[i])**2/(n*pr[i]||1)))};
function hom(c1,c2){const n1=sum(c1),n2=sum(c2);let x=0,df=-1;c1.forEach((o,i)=>{const t=o+c2[i];if(!t)return;df++;const e1=t*n1/(n1+n2),e2=t*n2/(n1+n2);x+=(o-e1)**2/e1+(c2[i]-e2)**2/e2});return{x,df,sig:df>0&&x>CR[Math.min(df,6)]}}
function runs(a){const m=st(a).med,b=a.filter(x=>x!=m).map(x=>x>m),n1=b.filter(x=>x).length,n2=b.length-n1;if(n1<10||n2<10)return null;let r=1;for(let i=1;i<b.length;i++)if(b[i]!=b[i-1])r++;const N=b.length,mu=2*n1*n2/N+1,s2=(mu-1)*(mu-2)/(N-1);return{z:(r-mu)/Math.sqrt(s2),r}}
const ac=a=>{const n=a.length;if(n<10)return null;const m=sum(a)/n;let nu=0,de=0;for(let i=0;i<n;i++){de+=(a[i]-m)**2;if(i)nu+=(a[i]-m)*(a[i-1]-m)}return nu/de};
function streaks(a){const h={};let c=0;a.forEach(x=>{if(x<2)c++;else{if(c)h[c]=(h[c]||0)+1;c=0}});if(c)h[c]=(h[c]||0)+1;return h}
const welch=(a,b)=>{const A=st(a.map(Math.log)),B=st(b.map(Math.log));if(A.n<2||B.n<2)return null;const se=Math.sqrt(A.v/A.n+B.v/B.n);return se?(A.mean-B.mean)/se:null};
const roll=(a,w,f)=>a.length<w?[]:a.slice(w-1).map((_,i)=>f(a.slice(i,i+w)));
function anoms(p,r=get(p)){const a=r.map(x=>x.m),n=a.length,o=[];if(n<30)return{o,n};const l=a.map(Math.log),m=sum(l)/n,sd=Math.sqrt(sum(l.map(x=>(x-m)**2))/(n-1));
l.forEach((x,i)=>{const z=(x-m)/sd;if(z>5)o.push({i,t:r[i].t,sev:z>6.5?'High':'Medium',why:`log-multiplier z-score ${z.toFixed(2)} (${a[i]}x)`,ex:'Heavy tails make extreme values possible by chance; this is a data-review flag only.'})});
const ts=r.map(x=>x.t),gp=[];for(let i=1;i<n;i++)if(ts[i]&&ts[i-1])gp.push(ts[i]-ts[i-1]);
if(gp.length>20){const md=[...gp].sort((x,y)=>x-y)[gp.length>>1];if(md>0)for(let i=1;i<n;i++)if(ts[i]&&ts[i-1]&&ts[i]-ts[i-1]>md*20)o.push({i,t:ts[i],sev:'Low',why:`gap of ${((ts[i]-ts[i-1])/6e4).toFixed(1)} min vs median ${(md/6e4).toFixed(2)} min`,ex:'Possible missing records or a collection pause.'})}
if(n>=120){const h=n>>1,A=st(l.slice(0,h)),B=st(l.slice(h)),F=B.v/A.v;if(F>1.6||F<1/1.6)o.push({i:h,t:r[h].t,sev:'Medium',why:`variance of log-multipliers changed ×${F.toFixed(2)} between halves`,ex:'Could reflect a different collection period or sampling noise.'})}
for(let i=0;i+10<=n;i+=10){const k=a.slice(i,i+10).filter(x=>x<1.5).length;if(k>=8)o.push({i,t:r[i].t,sev:'Low',why:`${k} of 10 consecutive rounds below 1.5x (expected about 3.5)`,ex:'Clusters appear by chance in long series; no implication for any later round.'})}
return{o:o.sort((x,y)=>x.i-y.i),n}}
/* ---- charts ---- */
const W=640,H=180,empty='<p class="mu">Not enough data yet.</p>';
function line(v,mk=[],col='#a78bfa'){if(v.length<2)return empty;const mx=Math.max(...v),mn=Math.min(...v),sx=i=>30+i*(W-40)/(v.length-1),sy=y=>H-20-(y-mn)/(mx-mn||1)*(H-40);return`<svg viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="${col}" stroke-width="1.5" points="${v.map((y,i)=>sx(i).toFixed(1)+','+sy(y).toFixed(1)).join(' ')}"/>${mk.map(i=>`<circle cx="${sx(i)}" cy="${sy(v[i])}" r="4" fill="#ef4444"/>`).join('')}<text x="2" y="12" fill="#9a93b0" font-size="10">${f2(mx)}</text><text x="2" y="${H-6}" fill="#9a93b0" font-size="10">${f2(mn)}</text></svg>`}
function bars(l,ser,cols=['#8b5cf6','#ef4444','#f59e0b']){const mx=Math.max(...ser.flat(),1e-9),bw=(W-40)/l.length,k=ser.length;return`<svg viewBox="0 0 ${W} ${H}">${l.map((t,i)=>ser.map((s,j)=>{const h=s[i]/mx*(H-40),w=(bw-8)/k;return`<rect x="${34+i*bw+j*w}" y="${H-20-h}" width="${w-1}" height="${h}" fill="${cols[j]}" rx="2"/>`}).join('')+`<text x="${30+i*bw+bw/2}" y="${H-5}" fill="#9a93b0" font-size="10" text-anchor="middle">${t}</text>`).join('')}</svg>`}
function heat(a){const k=Math.min(12,Math.floor(a.length/10));if(k<2)return empty;const sz=Math.ceil(a.length/k),w=(W-60)/k;let s='';for(let j=0;j<k;j++){const c=bc(a.slice(j*sz,(j+1)*sz)),t=sum(c)||1;c.forEach((v,i)=>{s+=`<rect x="${52+j*w}" y="${i*22+4}" width="${w-2}" height="20" rx="3" fill="#8b5cf6" opacity="${.08+.92*v/t}"/>`})}return`<svg viewBox="0 0 ${W} 160">${BL.map((l,i)=>`<text x="0" y="${i*22+18}" fill="#9a93b0" font-size="9">${l}</text>`).join('')}${s}</svg>`}
const C=(t,b,n)=>`<div class="card"><h3>${t}</h3>${b}${n?`<p class="mu">${n}</p>`:''}</div>`;

const sel=(id,o,cur,oc)=>`<select id="${id}" onchange="${oc}">${o.map(x=>`<option ${x==cur?'selected':''}>${x}</option>`).join('')}</select>`;

/* ---- views ---- */
function dash(){const r=get(S.p),a=r.map(x=>x.m),s=st(a),c=bc(a),all=get('All'),pn=PL.filter(p=>get(p).length).length,l=D.imp[0];

function plat(p){const r=get(p),a=r.map(x=>x.m),n=a.length;if(!n)return`<h2>${p} Analysis</h2>`+none(p);const s=st(a),c=bc(a),X=chi(c),ru=runs(a),A=ac(a.map(Math.log)),sh=streaks(a),w=Math.min(20,n>>1),ks=Object.keys(sh).map(Number).sort((x,y)=>x-y).slice(0,12);
return`<h2>${p} Analysis</h2><div class="grid">${K('Rounds',n,0)}${K('Mean',s.mean,2,'x')}${K('Median',s.med,2,'x')}${K('Std dev',s.sd)}${K('Variance',s.v)}${K('Quality',qual(r),0,'/100')}</div>
<div class="g2">${C('Distribution: observed vs reference model',bars(BL,[c.map(x=>x/n),tp]),'Purple observed, red reference (97% return-to-player model, P(M≥x)=0.97/x). The reference is an assumption, not a fact about this platform.')}${C('Percentiles & interval',`<div class="sc"><table><tr><th>P10</th><th>P25</th><th>P75</th><th>P90</th><th>P99</th></tr><tr>${s.p.map(x=>`<td>${f2(x)}x</td>`).join('')}</tr></table></div><p>Mean 95% CI: ${f2(s.mean-s.ci)}x to ${f2(s.mean+s.ci)}x</p>`,'Intervals assume approximate normality of the mean; multipliers are heavy-tailed, so intervals are optimistic for small samples.')}</div>
<div class="g2">${C('Validation tests',`<p>Chi-square vs reference: <b>${f2(X)}</b> (5% critical 12.59, 6 df) → ${X>12.59?'differs from':'consistent with'} the reference.</p><p>Runs test (above/below median): ${ru?`z = ${f2(ru.z)} → ${Math.abs(ru.z)>1.96?'order is unlikely random':'no evidence of non-random order'}`:'needs ≥10 rounds on each side'}.</p><p>Lag-1 autocorrelation (log): ${A==null?'–':f2(A)}</p><p>Sample size: ${n*tp[6]<5?`<b>small</b>; the 50x+ bin expects only ${(n*tp[6]).toFixed(1)} rounds, so chi-square is unreliable (about 260+ rounds recommended).`:'adequate for the chi-square test.'}</p>`,'Passing or failing a test does not make any later round predictable.')}${C('Streaks below 2.00x',ks.length?bars(ks,[ks.map(k=>sh[k])]):empty,'Bar labels are streak lengths. Independent rounds still produce streaks.')}</div>
<div class="g2">${C(`Rolling average (${w} rounds)`,w>=5?line(roll(a,w,x=>sum(x)/x.length)):empty)}${C(`Volatility: rolling std dev (${w} rounds)`,w>=5?line(roll(a,w,x=>st(x).sd),[],'#f87171'):empty)}</div>${C('Frequency heatmap: ranges across time (left = oldest)',heat(a),'Brighter cells show a larger share of that chunk in the range.')}`}
function cmp(){const names=['Winnbucks vs Mwos','Winnbucks vs PrideBet','Mwos vs PrideBet','All three'],sets=[[0,1],[0,2],[1,2],[0,1,2]],fr=S.from?Date.parse(S.from):0,to=S.to?Date.parse(S.to)+864e5:0,d=sets[S.cp].map(i=>{const r=get(PL[i],fr,to),a=r.map(x=>x.m);return{p:PL[i],a,s:st(a),c:bc(a),t:r.filter(x=>x.t).map(x=>x.t)}});
let h=`<h2>Compare Platforms</h2><div class="row">${names.map((x,i)=>`<button class="chip ${S.cp==i?'on':''}" onclick="S.cp=${i};render()">${x}</button>`).join('')}</div><div class="row"><span class="mu">From</span><input type="date" value="${S.from}" onchange="S.from=this.value;render()"><span class="mu">To</span><input type="date" value="${S.to}" onchange="S.to=this.value;render()"></div>`;
if(d.some(x=>!x.a.length))return h+`<div class="card"><p>Each selected platform needs data: ${d.filter(x=>!x.a.length).map(x=>x.p).join(', ')} has none in this range.</p><button class="p" onclick="go('dm')">Import data</button></div>`;
h+=C('Summary',`<div class="sc"><table><tr><th>Platform</th><th>Sample</th><th>Period</th><th>Mean</th><th>Median</th><th>≥10x</th><th>Volatility (sd ln)</th><th>Mean 95% CI</th></tr>${d.map(x=>`<tr><td>${x.p}</td><td>${x.a.length}</td><td>${x.t.length?new Date(Math.min(...x.t)).toLocaleDateString()+' – '+new Date(Math.max(...x.t)).toLocaleDateString():'no timestamps'}</td><td>${f2(x.s.mean)}x</td><td>${f2(x.s.med)}x</td><td>${pc(x.a.filter(v=>v>=10).length/x.a.length)}</td><td>${f2(st(x.a.map(Math.log)).sd)}</td><td>${f2(x.s.mean-x.s.ci)}–${f2(x.s.mean+x.s.ci)}</td></tr>`).join('')}</table></div>`)+C('Frequency distributions (% of rounds)',bars(BL,d.map(x=>x.c.map(v=>v/x.a.length)))+`<p class="mu">${d.map((x,i)=>`<span style="color:${['#8b5cf6','#ef4444','#f59e0b'][i]}">■</span> ${x.p}`).join(' &nbsp; ')}</p>`);
let t='';for(let i=0;i<d.length;i++)for(let j=i+1;j<d.length;j++){const w=welch(d[i].a,d[j].a),H2=hom(d[i].c,d[j].c);t+=`<p><b>${d[i].p} vs ${d[j].p}</b>: Welch t on log-multipliers = ${f2(w)} (${Math.abs(w)>1.96?'significant':'not significant'} at 5%); distribution chi-square = ${f2(H2.x)} (${H2.sig?'significant':'not significant'}).</p>`}

async function login(u){U=u;const q=(t,c,o)=>sb.from(t).select(c).order(o,{ascending:false}).limit(100);
const pl=await sb.from('platforms').select('id,name');if(pl.error){U=null;return showAuth('Database not set up: '+pl.error.message)}pl.data.forEach(x=>{PID[x.name]=x.id;PNM[x.id]=x.name});
let all=[],from=0;for(;;){const r=await sb.from('historical_rounds').select('id,platform_id,multiplier,round_time,source').order('id').range(from,from+999);if(r.error||!r.data.length)break;all.push(...r.data);if(r.data.length<1000)break;from+=1000}
const [im,au,pr,rp]=await Promise.all([q('imports','source,accepted,rejected,duplicates,created_at','created_at'),q('audit_log','message,created_at','created_at'),sb.from('profiles').select('display_name').eq('id',u.id).maybeSingle(),q('statistical_reports','id,scope,created_at,content','created_at')]);
D={rounds:all.map(x=>({id:x.id,p:PNM[x.platform_id],m:+x.multiplier,t:x.round_time?Date.parse(x.round_time):null,src:x.source})),imp:(im.data||[]).map(x=>({t:Date.parse(x.created_at),src:x.source,ok:x.accepted,fail:x.rejected,dup:x.duplicates})),audit:(au.data||[]).map(x=>({t:Date.parse(x.created_at),m:x.message})),name:(pr.data&&pr.data.display_name)||'',seq:1e12};S.saved=(rp.data||[]).slice(0,10);
const e=$('#au');if(e)e.remove();render()}
if(CF.SUPABASE_URL&&CF.SUPABASE_ANON_KEY&&window.supabase){sb=supabase.createClient(CF.SUPABASE_URL,CF.SUPABASE_ANON_KEY);
sb.auth.onAuthStateChange((ev,s)=>{if(ev=='PASSWORD_RECOVERY')setTimeout(()=>{const n=prompt('New password (8+ characters)');if(n)sb.auth.updateUser({password:n}).then(r=>alert(r.error?r.error.message:'Password updated.'))},0);if(s&&s.user&&!U)setTimeout(()=>login(s.user),0);if(ev=='SIGNED_OUT')showAuth()});
sb.auth.getSession().then(({data})=>{if(!data.session)showAuth()})}else showAuth();
render();
</script></body></html>
